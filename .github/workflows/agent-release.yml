name: agent-release

# A release of this library carries the agent: boreale-link.zip (the SD card's
# layout, unzipped at its root), boreale-link.nsp, boreale-link.json (the manifest
# the homebrews read: version, the bl:link protocol, the nsp's SHA-256, the kit it
# was built with) and SHA256SUMS.txt, attached to the release. The agent is built
# as ci.yml builds it, with the kit at the commit agent/KIT_REF names.
# workflow_dispatch builds the assets of a tag again (a release made before this
# workflow, a failed run).
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to attach the agent to (v1.2.0)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          path: boreale-link
      - name: The version and the kit
        id: what
        run: |
          set -e
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a release tag: $TAG" >&2; exit 1 ;; esac
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "kit=$(tr -d '[:space:]' < boreale-link/agent/KIT_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JigSawFr/boreale-kit
          ref: ${{ steps.what.outputs.kit }}
          path: boreale-kit
          submodules: false
      - name: Build the agent
        working-directory: boreale-link/agent
        env:
          AGENT_VERSION: ${{ steps.what.outputs.version }}
        run: |
          set -e
          git config --global --add safe.directory '*'
          make AGENT_VERSION="$AGENT_VERSION"
          SOURCE_DATE_EPOCH="$(git -C .. log -1 --format=%ct "$TAG")" ./dist.sh
      - name: The agent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boreale-link-agent
          path: |
            boreale-link/agent/out/boreale-link.zip
            boreale-link/agent/out/boreale-link.nsp
            boreale-link/agent/out/boreale-link.json
            boreale-link/agent/out/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: boreale-link-agent
          path: dist
      - name: Attach it to the release
        run: |
          set -e
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/boreale-link.zip dist/boreale-link.nsp dist/boreale-link.json dist/SHA256SUMS.txt
